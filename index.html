<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tookthel</title>
    <meta name="description" content="Yang bayarin dulu di kasir tetap balik modal. Bagi tagihan bareng teman lengkap dengan pajak & service." />
    <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script src="/splash.js"></script>
    <link rel="stylesheet" href="/src/splash.css" />
  </head>
  <body>
    <!-- Splash di awal sesi: animasinya di src/splash.css, keputusan tampil di public/splash.js, dan
         dilepas oleh src/app/splash.ts. Bentuk logonya sama dengan LOGO di src/ui/Logo.tsx. -->
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-stage">
        <div class="splash-mark">
          <span class="splash-confetti"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <svg class="splash-logo" viewBox="0 0 512 512">
            <defs>
              <clipPath id="splash-under-slot"><rect y="118" width="512" height="394" /></clipPath>
            </defs>
            <path class="splash-tile" d="M120 0h272a120 120 0 0 1 120 120v272a120 120 0 0 1-120 120H120A120 120 0 0 1 0 392V120A120 120 0 0 1 120 0z" />
            <rect class="splash-slot" x="140" y="108" width="232" height="12" rx="6" />
            <g clip-path="url(#splash-under-slot)">
              <g class="splash-paper">
                <path d="M156 128h200a20 20 0 0 1 20 20v236l-30-20-30 20-30-20-30 20-30-20-30 20-30-20-30 20V148a20 20 0 0 1 20-20z" fill="#D4F35B" />
                <path class="splash-cut" d="M256 140v214" stroke="#141414" stroke-width="10" stroke-dasharray="14 14" />
                <g class="splash-eyes">
                  <g class="splash-blink">
                    <circle cx="214" cy="222" r="14" fill="#141414" />
                    <circle cx="298" cy="222" r="14" fill="#141414" />
                  </g>
                </g>
                <path class="splash-smile" d="M212 270q44 36 88 0" pathLength="1" />
              </g>
            </g>
          </svg>
        </div>
        <p class="splash-name">Tookthel</p>
        <p class="splash-tagline">Jadi tumbal boleh, <em>rugi jangan.</em></p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
